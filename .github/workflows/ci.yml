name: CI

# macOS runner minutes count ten times against a private repository's quota, so the
# macOS job runs for main, pull requests and by hand; Linux runs on every push.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Lint and core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: linux-${{ hashFiles('Package.resolved') }}
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift Tools/SpeechBench/Sources Tools/SpeechBench/Package.swift
      - name: Test
        run: swift test

  macos:
    name: Build app and test (macOS)
    runs-on: macos-26
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: macos-${{ hashFiles('Package.resolved') }}
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Test
        run: swift test
      - name: Bundle
        run: scripts/build-app.sh
      - name: Smoke test
        run: |
          build/Listener.app/Contents/MacOS/listener replay Fixtures/delayed-executions/me.wav \
            Fixtures/delayed-executions/them.wav --script Fixtures/delayed-executions/script.json --speed 8
