name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Lint and core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Test
        run: swift test

  macos:
    name: Build app and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build
        run: swift build --product listener
      - name: Test
        run: swift test
      - name: Bundle
        run: scripts/build-app.sh
      - name: Smoke test
        run: |
          build/Listener.app/Contents/MacOS/listener replay Fixtures/delayed-executions/me.wav \
            Fixtures/delayed-executions/them.wav --script Fixtures/delayed-executions/script.json --speed 8
