// Trimmed copy of google/cloud/speech/v2/cloud_speech.proto from
// https://github.com/googleapis/googleapis at commit
// ba591f1d7fdedc610639425448756cd8a64adc0f.
//
// Only the StreamingRecognize RPC and the messages it uses are kept. Request
// messages keep only the fields Listener sets; response messages are complete
// apart from word-level details, which Chirp 3 does not return when streaming.
// Package, message, field names, numbers and types are unchanged, so the wire
// format is identical. The google.api annotations are dropped because they
// only matter to Google's client generators.
//
// Regenerate the Swift code with scripts/generate-protos.sh.

syntax = "proto3";

package google.cloud.speech.v2;

import "google/protobuf/duration.proto";

// Enables speech transcription and resource management.
service Speech {
  // Performs bidirectional streaming speech recognition: receive results while
  // sending audio. This method is only available via the gRPC API (not REST).
  rpc StreamingRecognize(stream StreamingRecognizeRequest)
      returns (stream StreamingRecognizeResponse) {}
}

// Explicitly specified decoding parameters.
message ExplicitDecodingConfig {
  // Supported audio data encodings.
  enum AudioEncoding {
    // Default value. This value is unused.
    AUDIO_ENCODING_UNSPECIFIED = 0;

    // Headerless 16-bit signed little-endian PCM samples.
    LINEAR16 = 1;

    // Headerless 8-bit companded mulaw samples.
    MULAW = 2;

    // Headerless 8-bit companded alaw samples.
    ALAW = 3;

    // AMR frames with an rfc4867.5 header.
    AMR = 4;

    // AMR-WB frames with an rfc4867.5 header.
    AMR_WB = 5;

    // FLAC frames in the "native FLAC" container format.
    FLAC = 6;

    // MPEG audio frames with optional (ignored) ID3 metadata.
    MP3 = 7;

    // Opus audio frames in an Ogg container.
    OGG_OPUS = 8;

    // Opus audio frames in a WebM container.
    WEBM_OPUS = 9;

    // AAC audio frames in an MP4 container.
    MP4_AAC = 10;

    // AAC audio frames in an M4A container.
    M4A_AAC = 11;

    // AAC audio frames in an MOV container.
    MOV_AAC = 12;
  }

  // Required. Encoding of the audio data sent for recognition.
  AudioEncoding encoding = 1;

  // Optional. Sample rate in Hertz of the audio data sent for recognition.
  // Valid values are: 8000-48000, and 16000 is optimal. Effectively required.
  int32 sample_rate_hertz = 2;

  // Optional. Number of channels present in the audio data sent for
  // recognition. Effectively required. The maximum allowed value is 8.
  int32 audio_channel_count = 3;
}

// Available recognition features.
message RecognitionFeatures {
  // If `true`, adds punctuation to recognition result hypotheses. This feature
  // is only available in select languages. The default `false` value does not
  // add punctuation to result hypotheses.
  bool enable_automatic_punctuation = 4;
}

// Provides information to the Recognizer that specifies how to process the
// recognition request.
message RecognitionConfig {
  // Decoding parameters for audio being sent for recognition.
  oneof decoding_config {
    // Explicitly specified decoding parameters.
    // Required if using headerless PCM audio (linear16, mulaw, alaw).
    ExplicitDecodingConfig explicit_decoding_config = 8;
  }

  // Optional. Which model to use for recognition requests. Select the model
  // best suited to your domain to get best results.
  string model = 9;

  // Optional. The language of the supplied audio as a
  // [BCP-47](https://www.rfc-editor.org/rfc/bcp/bcp47.txt) language tag.
  repeated string language_codes = 10;

  // Speech recognition features to enable.
  RecognitionFeatures features = 2;
}

// Metadata about the recognition request and response.
message RecognitionResponseMetadata {
  // Global request identifier auto-generated by the API.
  string request_id = 9;

  // When available, billed audio seconds for the corresponding request.
  google.protobuf.Duration total_billed_duration = 6;

  // Optional. Output only. Provides the prompt used for the recognition
  // request.
  optional string prompt = 10;
}

// Alternative hypotheses (a.k.a. n-best list).
message SpeechRecognitionAlternative {
  // Transcript text representing the words that the user spoke.
  string transcript = 1;

  // The confidence estimate between 0.0 and 1.0. Set only for the top
  // alternative of a final streaming result. 0.0 means it was not set.
  float confidence = 2;
}

// Available recognition features specific to streaming recognition requests.
message StreamingRecognitionFeatures {
  // Endpointing sensitivity is intended for applications that want to minimize
  // result latency, possibly at the expense of quality. Some utterances may be
  // broken up into multiple fragments.
  enum EndpointingSensitivity {
    // If no value is specified, the values for
    // ENDPOINTING_SENSITIVITY_STANDARD will be used.
    ENDPOINTING_SENSITIVITY_UNSPECIFIED = 0;

    // Standard sensitivity, no optimization for latency.
    ENDPOINTING_SENSITIVITY_STANDARD = 1;

    // Super short sensitivity, optimized for super short utterances like single
    // words ("Yes", "No", "Hello", etc.) or a single phrase, command or short
    // query (e.g. "check balance", "five dollars", "call Mom").
    ENDPOINTING_SENSITIVITY_SUPERSHORT = 2;

    // Short sensitivity, optimized for short utterances like single sentences.
    ENDPOINTING_SENSITIVITY_SHORT = 3;
  }

  // If `true`, responses with voice activity speech events will be returned as
  // they are detected.
  bool enable_voice_activity_events = 1;

  // Whether or not to stream interim results to the client. If set to true,
  // interim results will be streamed to the client. Otherwise, only the final
  // response will be streamed back.
  bool interim_results = 2;

  // voice_activity_timeout (field 3) is left out on purpose: it makes the
  // server close the stream after a pause, which is not what we want.

  // Optional. Endpointing sensitivity for this stream.
  EndpointingSensitivity endpointing_sensitivity = 8;
}

// Provides configuration information for the StreamingRecognize request.
message StreamingRecognitionConfig {
  // Required. Features and audio metadata to use for the Automatic Speech
  // Recognition.
  RecognitionConfig config = 1;

  // Speech recognition features to enable specific to streaming audio
  // recognition requests.
  StreamingRecognitionFeatures streaming_features = 2;
}

// Request message for the StreamingRecognize method. Multiple
// StreamingRecognizeRequest messages are sent in one call.
//
// The first message must contain a recognizer and a streaming_config and must
// not contain audio. All subsequent messages must only have audio set.
message StreamingRecognizeRequest {
  // Required. The name of the Recognizer to use during recognition. The
  // expected format is
  // `projects/{project}/locations/{location}/recognizers/{recognizer}`. The
  // {recognizer} segment may be set to `_` to use an empty implicit Recognizer.
  string recognizer = 3;

  oneof streaming_request {
    // StreamingRecognitionConfig to be used in this recognition attempt.
    // If provided, it will override the default RecognitionConfig stored in the
    // Recognizer.
    StreamingRecognitionConfig streaming_config = 6;

    // Inline audio bytes to be Recognized.
    // Maximum size for this field is 15 KB per request.
    bytes audio = 5;
  }
}

// A streaming speech recognition result corresponding to a portion of the audio
// that is currently being processed.
message StreamingRecognitionResult {
  // May contain one or more recognition hypotheses. These alternatives are
  // ordered in terms of accuracy, with the top (first) alternative being the
  // most probable, as ranked by the recognizer.
  repeated SpeechRecognitionAlternative alternatives = 1;

  // If `false`, this StreamingRecognitionResult represents an interim result
  // that may change. If `true`, this is the final time the speech service will
  // return this particular StreamingRecognitionResult.
  bool is_final = 2;

  // An estimate of the likelihood that the recognizer will not change its guess
  // about this interim result. Values range from 0.0 (completely unstable)
  // to 1.0 (completely stable). Only provided for interim results.
  float stability = 3;

  // Time offset of the end of this result relative to the beginning of the
  // audio.
  google.protobuf.Duration result_end_offset = 4;

  // For multi-channel audio, this is the channel number corresponding to the
  // recognized result for the audio from that channel.
  int32 channel_tag = 5;

  // Output only. The BCP-47 language tag of the language in this result.
  string language_code = 6;
}

// `StreamingRecognizeResponse` is the only message returned to the client by
// `StreamingRecognize`. If there is no recognizable audio then no messages are
// streamed back to the client.
//
// In each response, only one of these fields will be set:
//   `error`,
//   `speech_event_type`, or
//   one or more (repeated) `results`.
message StreamingRecognizeResponse {
  // Indicates the type of speech event.
  enum SpeechEventType {
    // No speech event specified.
    SPEECH_EVENT_TYPE_UNSPECIFIED = 0;

    // The server has detected the end of the user's speech utterance and
    // expects no additional speech. Only sent by the `latest_short` model.
    END_OF_SINGLE_UTTERANCE = 1;

    // The server has detected the beginning of human voice activity in the
    // stream. Only sent if `voice_activity_events` is set to true.
    SPEECH_ACTIVITY_BEGIN = 2;

    // The server has detected the end of human voice activity in the stream.
    // Only sent if `voice_activity_events` is set to true.
    SPEECH_ACTIVITY_END = 3;
  }

  // This repeated list contains zero or more results that correspond to
  // consecutive portions of the audio currently being processed. It contains
  // zero or one `is_final`=`true` result (the newly settled portion), followed
  // by zero or more `is_final`=`false` results (the interim results).
  repeated StreamingRecognitionResult results = 6;

  // Indicates the type of speech event.
  SpeechEventType speech_event_type = 3;

  // Time offset between the beginning of the audio and event emission.
  google.protobuf.Duration speech_event_offset = 7;

  // Metadata about the recognition.
  RecognitionResponseMetadata metadata = 5;
}
